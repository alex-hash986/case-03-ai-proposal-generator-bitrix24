[project]
name = "case-03-ai-proposal-generator-bitrix24"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi", "uvicorn", "streamlit", "httpx", "pydantic-settings>=2.8",
    "pyyaml", "python-docx", "reportlab", "filelock",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "types-PyYAML", "types-reportlab"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src", "src.*", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--basetemp=.case03-pytest-temp"

[tool.ruff]
extend-exclude = ["data", "artifacts", ".case03-pytest-temp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
strict = true
exclude = ["^data/", "^artifacts/"]

[[tool.mypy.overrides]]
module = ["docx.*"]
ignore_missing_imports = true
